syntax = "proto3";

package order.common;

option go_package="order/order_common";

message Order{
  uint64 user_id=1;
  string number=2; // 订单号
  repeated Status  status=3;
  uint64 address_book_id=4; // 收货地址
  int32 pay_method=5;
  float amount=7;
  string remark=8;
  string phone=9;
  string address=10; // 发货地址
  string username=11;
  string consignee=12;
  uint64 ID=13;
  uint64 shop_id=14;
  uint32 final_status=15;
}

message Status{
  string start_time=1;
  string end_time=2;
  uint32 status=3;
  string description=4;
}

message OrderDetail{
  string name=1;
  string image=2;
  uint64 order_id=3;
  uint64 product_id=4;
  uint32 number=5; // 商品数量
  float  amount=6; // 注意一个order可以关联多个orderDetail,orderDetail往往只含有一个Product
}

message OrderResp{
  Order order=1;
  uint64 shop_id=2;
  repeated OrderDetail order_details=3;
}

message Empty{}

message OrderReq{
  uint64 order_id=1;
  uint64 shop_id=2;
  repeated OrderDetail list=3;
  uint64 target_user_id=4;
  uint64 request_user_id=5;
}

message CancelReq{
  uint64 order_id=1;
  string cancel_reason=2;
  uint64 shop_id=3;
  uint64 target_user_id=4;
  uint64 request_user_id=5;
}