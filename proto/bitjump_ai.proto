syntax="proto3";

package ai;

option go_package="/ai";

service AiService {
    // 根据订单号查询订单信息
    rpc OrderQuery(OrderQueryReq) returns (OrderQueryResp) {}
    // 根据用户id和用户要求自动创建订单并返回订单号
    rpc AutoPlaceOrder(AutoPlaceOrderReq) returns (AutoPlaceOrderResp) {}
    // AI聊天
    rpc AIChat(AIChatReq) returns (AIChatResp) {}
}

message OrderQueryReq {
    uint64 order_id = 1;
    uint64 target_user_id=2;
    uint64 request_user_id=3;
}

message OrderQueryResp {
    string response = 1;
}

message AutoPlaceOrderReq {
    uint64 target_user_id = 1;
    string request = 2;
    uint64 request_user_id=3;
}

message AutoPlaceOrderResp {
    uint64 order_id = 1;
}

message AIChatReq {
    string question = 1;
    string target_user_id=2;
    string request_user_id=3;
}

message AIChatResp {
    string answer = 1;
}
