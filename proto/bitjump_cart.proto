syntax = "proto3";

package cart;

option go_package = '/cart';

service CartService {
    // 添加物品
    rpc AddItem(AddItemReq) returns (AddItemResp) {}
    // 获取购物车
    rpc GetCart(GetCartReq) returns (GetCartResp) {}
    // 删除某个物品
    rpc DeleteItem(DeleteItemReq) returns (EmptyCartResp){}
    // 清空购物车
    rpc EmptyCart(EmptyCartReq) returns (EmptyCartResp) {}
}

message CartItem {
    uint64 product_id = 1;
    int32  quantity = 2;
    uint64 request_user_id=3;
    uint64 target_user_id=4;
}

message AddItemReq {
    uint64 target_user_id = 1;
    CartItem item = 2;
    uint64 request_user_id=3;
}

message AddItemResp {}

message EmptyCartReq {
    uint64 request_user_id = 1;
    uint64 target_user_id=2;
}

message GetCartReq {
    uint64 request_user_id = 1;
    uint64 target_user_id = 2;
}

message GetCartResp {
    Cart cart = 1;
}

// 删除请求
message DeleteItemReq{
    uint64 target_user_id=1;
    uint64 product_id=2;
    uint32 num=3;
    uint64 request_user_id=4;
}

message Cart {
    uint64 user_id = 1;
    repeated CartItem items = 2;
}

message EmptyCartResp {}