syntax="proto3";

package user;

option go_package="/user";

service UserService {
    // 用户注册
    rpc Register(RegisterReq) returns (RegisterResp) {}
    // 用户登录
    rpc Login(LoginReq) returns (LoginResp) {}
    // 获取用户信息
    rpc GetUserInfo(GetUserInfoReq) returns (GetUserInfoResp) {}
    // 用户登出
    rpc Logout(LogoutReq) returns (LogoutResp) {}
    //修改用户
    rpc Update(UpdateReq) returns (UpdateResp){}
    //删除用户
    rpc Delete(DeleteReq) returns (DeleteResp){}
    // 分发token
    rpc DeliverTokenByRPC(DeliverTokenReq) returns (DeliveryResp) {}
    // 验证token/续期
    rpc VerifyTokenByRPC(VerifyTokenReq) returns (VerifyResp) {}
}

message RegisterReq {
    string email = 1;
    string password = 2;
    string confirm_password=3;
    string nickname = 4;
    string avatar = 5;
    string phone = 6;
    uint32 gender = 7;
}

message RegisterResp {
    uint64 user_id = 1;
}

message LoginReq {
    string email= 1;
    string password = 2;
}

message LoginResp {
    uint64 user_id = 1;
}

message GetUserInfoReq {
    uint64 user_id=1;
}

message GetUserInfoResp {
    string email = 1;
    string nickname = 2;
    string avatar = 3;
    string phone = 4;
    uint32 gender = 5;
}

message LogoutReq {
    string token = 1;
}

message LogoutResp {}

message UpdateReq{
    string password = 1;
    string nickname = 2;
    string avatar = 3;
    string phone = 4;
    uint32 gender = 5;
    uint64 user_id=6;
}

message UpdateResp{}

message DeleteReq{
    uint64 user_id=1;
}

message DeleteResp{}

message DeliverTokenReq {
    uint64 user_id = 1;
}

message VerifyTokenReq {
    string token = 1;
}

message DeliveryResp {
    string token = 1;
}

message VerifyResp {
    bool res = 1;
    string token=2;
    uint64 user_id=3;
}