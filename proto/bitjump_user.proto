syntax="proto3";

package user;

import "bitjump_auth.proto";

option go_package="/user";

service UserService {
    // 用户注册
    rpc Register(RegisterReq) returns (RegisterResp) {}
    // 用户登录
    rpc Login(LoginReq) returns (LoginResp) {}
    // 用户登出
    rpc Logout(LogoutReq) returns (Empty) {}
    // 获取用户信息
    rpc GetUserInfo(GetUserInfoReq) returns (GetUserInfoResp) {}
    //修改用户
    rpc Update(UpdateReq) returns (Empty){}
    //删除用户
    rpc Delete(DeleteReq) returns (Empty){}
    //批量获取用户
    rpc ListUsers(ListUsersReq) returns (ListUsersResp);
    // 分发token
    rpc DeliverTokenByRPC(DeliverTokenReq) returns (DeliveryResp) {}
    // 验证token/续期
    rpc VerifyTokenByRPC(VerifyTokenReq) returns (VerifyResp) {}
    //修改密码
    rpc ChangePassword(ChangePasswordReq) returns (Empty);
    //忘记密码
    rpc ForgotPassword(ForgotPasswordReq) returns (ForgotPasswordResp);
    //校验验证码
    rpc VerifySmsCode(VerifySmsCodeReq)returns(VerifySmsCodeResp);
    //重置密码
    rpc ResetPassword(ResetPasswordReq)returns (Empty);
    //预绑定邮箱
    rpc PreBindEmail(PreBindEmailReq) returns (Empty);
    //绑定邮箱
    rpc BindEmail(BindEmailReq) returns (Empty);
    //预解绑邮箱
    rpc PreUnbindEmail(PreUnbindEmailReq)returns(Empty);
    //解绑邮箱
    rpc UnbindEmail(UnbindEmailReq) returns (Empty);
    //预冻结用户
    rpc PreFreezeUser(PreFreezeUserReq)returns(Empty);
    //冻结用户
    rpc FreezeUser(FreezeUserReq) returns (Empty);
    //预解冻用户
    rpc PreUnfreezeUser(PreUnFreezeUserReq)returns(Empty);
    //解冻用户
    rpc UnfreezeUser(UnfreezeUserReq) returns (Empty);
}

message Empty{}

message User{
    string email=1;
    string name=3;
    string avatar=4;
    string phone=5;
    uint32 gender=6;
    uint32 status=7;
    uint64 id=8;
}

message Filter{
    string field_name=1;
    string operator=2;
    string value=3;
}

message RegisterReq {
    string email = 1;
    string password = 2;
    string confirm_password=3;
    string nickname = 4;
    string avatar = 5;
    string phone = 6;
    uint32 gender = 7;
}

message RegisterResp {
    uint64 user_id = 1;
}

message LoginReq {
    string email= 1;
    string password = 2;
}

message LoginResp {
    uint64 user_id = 1;
}

message GetUserInfoReq {
    uint64 target_user_id=1;
    uint64 request_user_id=2;
}

message GetUserInfoResp {
    string email = 1;
    string nickname = 2;
    string avatar = 3;
    string phone = 4;
    uint32 gender = 5;
}

message LogoutReq {
    string token = 1;
    uint64 target_user_id=2;
    uint64 request_user_id=3;
}

message UpdateReq{
    string name = 1;
    string avatar = 2;
    string phone = 3;
    uint32 gender = 4;
    uint64 target_user_id=5;
    uint64 request_user_id=6;
}

message DeleteReq{
    uint64 target_user_id=1;
    uint64 request_user_id=2;
}

message DeliverTokenReq {
    uint64 target_user_id = 1;
    uint64 request_user_id=4;
}

message VerifyTokenReq {
    string token = 1;
    uint64 target_user_id=2;
    uint64 request_user_id=3;
}

message DeliveryResp {
    string token = 1;
}

message VerifyResp {
    bool res = 1;
    string token=2;
    uint64 user_id=3;
}

message ListUsersReq{
    uint32 page = 1;
    uint32 page_size = 2;
    repeated Filter filter=3;
    uint64 request_user_id=4;
}

message ListUsersResp{
    repeated User users=1;
    uint32 total = 2;
}

message ChangePasswordReq{
    uint64 target_user_id = 1;
    string old_password = 2;
    string new_password = 3;
    uint64 request_user_id=4;
}

message ForgotPasswordReq {
    string email = 1;
}

message ForgotPasswordResp{
    uint64 user_id=1;
}

message ResetPasswordReq{
    string reset_token = 1;
    string email=2;
    string new_password = 3;
    uint64 request_user_id=4;
    uint64 target_user_id=5;
}

message VerifySmsCodeReq{
    uint64 type=1;
    string verify_code = 2;
    uint64 request_user_id=3;
    uint64 target_user_id=4;
}

message VerifySmsCodeResp{
    string reset_token=1;
}

message BindEmailReq {
    uint64 target_user_id = 1;
    string email = 2;
    string reset_token = 3;
    uint64 request_user_id=4;
}

message UnbindEmailReq {
    uint64 target_user_id = 1;
    uint64 request_user_id = 2;
    string reset_token=3;
}

message FreezeUserReq {
    uint64 target_user_id = 1;
    uint64 request_user_id=2;
    string reset_token=3;
}

message UnfreezeUserReq {
    uint64 target_user_id = 1;
    uint64 request_user_id=2;
    string reset_token=3;
}

message PreBindEmailReq{
    uint64 target_user_id=1;
    uint64 request_user_id=2;
}

message PreUnbindEmailReq{
    uint64 target_user_id=1;
    uint64 request_user_id=2;
}

message PreFreezeUserReq{
    uint64 target_user_id=1;
    uint64 request_user_id=2;
}

message PreUnFreezeUserReq{
    uint64 target_user_id=1;
    uint64 request_user_id=2;
}

